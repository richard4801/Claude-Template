name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Chaquopy builds the app's Python (3.13) with a matching Python on the build machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The runner already has an SDK; only accept the licences and add platform-tools (the action's default "tools" package no longer exists).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Core and app unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      # Roborazzi writes images only when recording. Record a few Edit screens (home with drafts, TikTok view) for review;
      # they're uploaded as android-edit-screenshots below.
      - name: Record Edit screenshots
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest -Proborazzi.test.record=true
          --tests '*EditSuiteScreenshotTest*home*' --tests '*EditSuiteScreenshotTest*tiktok*'

      # Release key from repository secrets when they exist (decoded to a temp file, never printed); otherwise the
      # build falls back to the debug key (android/app/build.gradle.kts).
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.MUSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MUSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/muse-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            {
              echo "MUSE_KEYSTORE_PATH=$ks"
              echo "MUSE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              if [ -n "$KEY_ALIAS" ]; then echo "MUSE_KEY_ALIAS=$KEY_ALIAS"; fi
              if [ -n "$KEY_PASSWORD" ]; then echo "MUSE_KEY_PASSWORD=$KEY_PASSWORD"; fi
            } >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$apk" "dist/MUSE-android-${version}-${{ github.run_number }}.apk"
          ls -la dist
          {
            echo "### MUSE Android ${version} (build ${{ github.run_number }})"
            if [ "$SIGNING" = release ]; then
              echo "Signed with the release key."
            else
              echo "debug-signed: uninstall the old app before installing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MUSE-android
        uses: actions/upload-artifact@v4
        with:
          name: MUSE-android
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/muse-release.jks"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests
          if-no-files-found: ignore

      # Edit's screenshots (Robolectric + Roborazzi), so a reviewer can look at them without a phone.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-edit-screenshots
          path: android/app/build/outputs/roborazzi/edit_*.png
          if-no-files-found: ignore
          retention-days: 14
