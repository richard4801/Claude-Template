name: mac

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json

      # The real API (server/api) on this runner only: embedded Postgres in memory, local storage, simulated GPU and
      # images, dev seed. The contract tests create accounts and move tokens, so they never run against the hosted server.
      - name: Start the real API locally
        run: |
          cd server/api
          npm ci --no-audit --no-fund
          (PORT=8798 PUBLIC_URL=http://127.0.0.1:8798 node --import tsx scripts/test-server.ts > /tmp/api.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8798/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: MuseCore tests (contract tests against server/api and server/mock)
        run: |
          if [ -f server/mock/server.js ]; then
            (cd server/mock && PORT=8799 node server.js > /tmp/mock.log 2>&1 &)
            sleep 2
            export MUSE_MOCK_URL=http://localhost:8799
          fi
          export MUSE_API_URL=http://127.0.0.1:8798
          cd mac/MuseCore
          swift test

      - name: Server logs
        if: failure()
        run: tail -n 200 /tmp/api.log /tmp/mock.log || true

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: mac
        run: |
          set +e
          xcodebuild -project Muse.xcodeproj -scheme Muse -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1
          status=$?
          # Show errors and our own warnings either way; fail the job when xcodebuild failed (the old `| grep … || true` hid errors).
          grep -E "error:|warning: .*Muse/|BUILD" build.log || true
          if [ $status -ne 0 ]; then echo "xcodebuild failed ($status)"; tail -n 80 build.log; exit $status; fi
          test -d build/Build/Products/Release/MUSE.app

      - name: Ad-hoc sign and zip
        working-directory: mac
        run: |
          APP=build/Build/Products/Release/MUSE.app
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" MUSE-mac.zip

      # Review screenshots of the key screens in the four themes (SnapshotRunner, demo mode, no server). Never fails the build.
      - name: Review screenshots
        continue-on-error: true
        working-directory: mac
        run: |
          APP=build/Build/Products/Release/MUSE.app
          EXE="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          mkdir -p snapshots
          MUSE_SNAPSHOT_DIR="$PWD/snapshots" "$EXE" > snapshots.log 2>&1 &
          pid=$!
          for i in $(seq 1 900); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la snapshots | head -100
          tail -n 40 snapshots.log || true

      # Opening Edit with takes shaped like live ones must not crash (owner blocker 2026-11-07). The review run writes each
      # step before it runs (SnapshotRunner+Edit.swift), so a crash leaves the step that crashed as the last START line.
      - name: Edit check
        working-directory: mac
        run: |
          f=snapshots/edit-check.txt
          if [ ! -f "$f" ]; then echo "no edit-check.txt (review mode didn't reach the Edit check)"; tail -n 60 snapshots.log || true; exit 1; fi
          cat "$f"
          if grep -q '^FAIL' "$f"; then exit 1; fi
          if [ "$(tail -n 1 "$f")" != "ALL DONE" ]; then echo "The app stopped during: $(grep '^START' "$f" | tail -n 1)"; tail -n 80 snapshots.log || true; exit 1; fi

      # Every main page and Settings pane must scroll with a real scroll event (owner blocker 2026-11-07). Fails on a STUCK
      # page as long as at least one page MOVED (so the synthetic events themselves work on this runner).
      - name: Scroll check
        working-directory: mac
        run: |
          f=snapshots/scroll-check.txt
          if [ ! -f "$f" ]; then echo "no scroll-check.txt (review mode didn't finish)"; exit 1; fi
          cat "$f"
          if grep -q '^MOVED' "$f" && grep -q '^STUCK' "$f"; then echo "Some pages don't scroll"; exit 1; fi
          if ! grep -q '^MOVED' "$f"; then echo "::warning::No page moved: synthetic scroll events may not reach the app on this runner"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: mac/snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MUSE-mac
          path: mac/MUSE-mac.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: mac/build.log
          if-no-files-found: ignore
