name: mac

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          brew install xcodegen

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json

      # The real API (server/api) on this runner only: embedded Postgres in memory, local storage, simulated GPU and
      # images, dev seed. The contract tests create accounts and move tokens, so they never run against the hosted server.
      - name: Start the real API locally
        run: |
          cd server/api
          npm ci --no-audit --no-fund
          (PORT=8798 PUBLIC_URL=http://127.0.0.1:8798 node --import tsx scripts/test-server.ts > /tmp/api.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8798/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: MuseCore tests (contract tests against server/api and server/mock)
        run: |
          if [ -f server/mock/server.js ]; then
            (cd server/mock && PORT=8799 node server.js > /tmp/mock.log 2>&1 &)
            sleep 2
            export MUSE_MOCK_URL=http://localhost:8799
          fi
          export MUSE_API_URL=http://127.0.0.1:8798
          cd mac/MuseCore
          swift test

      - name: Server logs
        if: failure()
        run: tail -n 200 /tmp/api.log /tmp/mock.log || true

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: mac
        run: |
          set +e
          xcodebuild -project Muse.xcodeproj -scheme Muse -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1
          status=$?
          # Show errors and our own warnings either way; fail the job when xcodebuild failed (the old `| grep … || true` hid errors).
          grep -E "error:|warning: .*Muse/|BUILD" build.log || true
          if [ $status -ne 0 ]; then echo "xcodebuild failed ($status)"; tail -n 80 build.log; exit $status; fi
          test -d build/Build/Products/Release/MUSE.app

      - name: Ad-hoc sign and zip
        working-directory: mac
        run: |
          APP=build/Build/Products/Release/MUSE.app
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" MUSE-mac.zip

      # The app goes up as soon as it is built and signed, so the owner can hand-test it while the checks below still run.
      - name: Upload MUSE-mac
        uses: actions/upload-artifact@v4
        with:
          name: MUSE-mac
          path: mac/MUSE-mac.zip
          if-no-files-found: error

      # Review screenshots of the key screens in the four themes (SnapshotRunner, demo mode, no server). Never fails the build.
      # The app gets up to 1800 s; it prints its own log even when it had to be stopped.
      - name: Review screenshots
        continue-on-error: true
        working-directory: mac
        run: |
          APP=build/Build/Products/Release/MUSE.app
          EXE="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          mkdir -p snapshots
          MUSE_SNAPSHOT_DIR="$PWD/snapshots" "$EXE" > snapshots.log 2>&1 &
          pid=$!
          for i in $(seq 1 1800); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then echo "review mode still running after 1800 s: stopping it"; kill $pid 2>/dev/null || true; fi
          status=0; wait $pid || status=$?; echo "review mode exit status: $status (128+n = killed by signal n)"
          ls -la snapshots | head -100
          tail -n 60 snapshots.log || true

      # Closing a chat mid-reply in the same tick as a screen change must not freeze the app (plans/claude-chat-mac.md).
      # Review mode runs it first (SnapshotRunner+StreamClose.swift); on a freeze it samples the app into the snapshots.
      - name: Stream close check
        working-directory: mac
        run: |
          f=snapshots/stream-close.txt
          if [ ! -f "$f" ]; then echo "no stream-close.txt (review mode didn't reach it)"; exit 1; fi
          cat "$f"
          if [ -f snapshots/stream-close-sample.txt ]; then head -n 400 snapshots/stream-close-sample.txt; fi
          if grep -q '^CUT' "$f"; then exit 1; fi
          if [ "$(grep -c '^FITS stream_close' "$f")" -ne 6 ] || ! grep -q '^DONE stream_close' "$f"; then echo "stream close check incomplete"; exit 1; fi

      # Generate must be fully on screen, with its price, and every bar pill whole in the composer from 1440 × 900 down to 960 × 640 (owner fix A2, coordination item 8). Fails on any CUT line.
      - name: Composer fit check
        working-directory: mac
        run: |
          f=snapshots/fit-check.txt
          if [ ! -f "$f" ]; then echo "no fit-check.txt (review mode didn't finish)"; exit 1; fi
          cat "$f"
          if grep -q '^CUT' "$f"; then echo "Generate is cut off"; exit 1; fi

      # A screen change must never leave the old screen drawn (plans/claude-chat-mac.md): in every theme (10 tries each) a live chat
      # overlay closes in the same tick as openEdit + openRecreate, and 1 s later the window must hold only store.screen
      # (SnapshotRunner+Chat.swift, staleScreenCheck). Its CUT lines already fail the fit check; this step makes sure it ran.
      - name: Stale screen check
        working-directory: mac
        run: |
          f=snapshots/fit-check.txt
          grep 'stale_screen' "$f" || true
          if [ "$(grep -c '^FITS stale_screen' "$f")" -ne 40 ]; then echo "stale screen check missing or failed"; exit 1; fi

      # Opening Edit with takes shaped like live ones must not crash (owner blocker 2026-11-07). The review run writes each
      # step before it runs (SnapshotRunner+Edit.swift), so a crash leaves the step that crashed as the last START line.
      - name: Edit check
        working-directory: mac
        run: |
          f=snapshots/edit-check.txt
          if [ ! -f "$f" ]; then echo "no edit-check.txt (review mode didn't reach the Edit check)"; tail -n 60 snapshots.log || true; exit 1; fi
          cat "$f"
          if grep -q '^FAIL' "$f"; then exit 1; fi
          if [ "$(tail -n 1 "$f")" != "ALL DONE" ]; then echo "The app stopped during: $(grep '^START' "$f" | tail -n 1)"; tail -n 80 snapshots.log || true; exit 1; fi

      # Every Edit operation must WORK, not just not crash (Mac Edit audit 2026-11-08, plans/mac-edit-audit.md): each runs
      # through the real editor session and its project, preview frame and (for the export) the rendered file's length,
      # size, picture and sound are checked (SnapshotRunner+EditOps.swift). Fails on any FAIL line or a missing ALL DONE.
      - name: Edit operations and export check
        working-directory: mac
        run: |
          f=snapshots/edit-ops-check.txt
          if [ ! -f "$f" ]; then echo "no edit-ops-check.txt (review mode didn't reach it)"; tail -n 60 snapshots.log || true; exit 1; fi
          cat "$f"
          if grep -q '^FAIL' "$f"; then exit 1; fi
          if [ "$(tail -n 1 "$f")" != "ALL DONE" ]; then echo "The app stopped during: $(grep '^STEP' "$f" | tail -n 1)"; tail -n 80 snapshots.log || true; exit 1; fi

      # The owner's Claude chat report (WS18): one message shows one bubble; chats survive closing; New chat, switch, rename
      # and delete; Claude's rig, prompt and reference reach the composer (live, and read again after the tool step); each
      # Suite mode returns to its own latest chat (SnapshotRunner+ClaudeChecks.swift). Fails on any FAIL or a missing ALL DONE.
      - name: Claude chat check
        working-directory: mac
        run: |
          f=snapshots/claude-chat-check.txt
          if [ ! -f "$f" ]; then echo "no claude-chat-check.txt (review mode didn't reach it)"; tail -n 60 snapshots.log || true; exit 1; fi
          cat "$f"
          if grep -q '^FAIL' "$f"; then exit 1; fi
          if [ "$(tail -n 1 "$f")" != "ALL DONE" ]; then echo "The check stopped early"; tail -n 80 snapshots.log || true; exit 1; fi

      # The owner's Suite stage report (WS19): Photo × 4 shows generating, then a carousel of four on the stage, still
      # there after leaving and after a restart, with a Queue row; Shot the same (SnapshotRunner+SuiteStage.swift).
      - name: Suite stage check
        working-directory: mac
        run: |
          f=snapshots/suite-stage-check.txt
          if [ ! -f "$f" ]; then echo "no suite-stage-check.txt (review mode didn't reach it)"; tail -n 60 snapshots.log || true; exit 1; fi
          cat "$f"
          if grep -q '^FAIL' "$f"; then exit 1; fi
          if [ "$(tail -n 1 "$f")" != "ALL DONE" ]; then echo "The check stopped early"; tail -n 80 snapshots.log || true; exit 1; fi

      # When review mode stops early, the crash report says where (thread, frames, exception).
      - name: Crash report
        if: failure()
        run: |
          grep -E "uncaught|signal|CRASH" mac/snapshots.log | head -n 80 || true
          for i in $(seq 1 20); do
            f=$(ls -t ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>/dev/null | grep -i -E '^MUSE' | head -n 1)
            [ -n "$f" ] && break; sleep 1
          done
          if [ -z "$f" ]; then echo "no MUSE crash report"; exit 0; fi
          p=$(ls ~/Library/Logs/DiagnosticReports/"$f" /Library/Logs/DiagnosticReports/"$f" 2>/dev/null | head -n 1)
          echo "== $p"; head -c 60000 "$p"

      # Every main page and Settings pane must scroll with a real scroll event (owner blocker 2026-11-07). Fails on a STUCK
      # page as long as at least one page MOVED (so the synthetic events themselves work on this runner).
      - name: Scroll check
        working-directory: mac
        run: |
          f=snapshots/scroll-check.txt
          if [ ! -f "$f" ]; then echo "no scroll-check.txt (review mode didn't finish)"; exit 1; fi
          cat "$f"
          if grep -q '^MOVED' "$f" && grep -q '^STUCK' "$f"; then echo "Some pages don't scroll"; exit 1; fi
          if ! grep -q '^MOVED' "$f"; then echo "::warning::No page moved: synthetic scroll events may not reach the app on this runner"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: mac/snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: mac/build.log
          if-no-files-found: ignore
