<title>Muse Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone = top bar + scrolling view + bottom tab bar; >=960px = left rail + view + sticky control column.
   Direction: a dim photo studio — graphite walls, one jade "tally light" accent for go/active, paper-white type. */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --surface-2:#ecedea; --line:#d9dbd6; --fg:#16181a; --muted:#5d625f;
  --accent:#0d7a5f; --accent-ink:#ffffff; --accent-soft:#d5ece4; --warn:#a86400; --warn-soft:#f6e7cc; --bad:#b3261e; --bad-soft:#f6dcda; --good:#1f7a3a;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121414; --surface:#1a1d1d; --surface-2:#232727; --line:#2f3434; --fg:#eef0ee; --muted:#9aa29f;
  --accent:#3fd3a6; --accent-ink:#06261d; --accent-soft:#163a31; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; --good:#6fdc8c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121414; --surface:#1a1d1d; --surface-2:#232727; --line:#2f3434; --fg:#eef0ee; --muted:#9aa29f;
  --accent:#3fd3a6; --accent-ink:#06261d; --accent-soft:#163a31; --warn:#f0b35a; --warn-soft:#3a2b14; --bad:#ff8a80; --bad-soft:#3d1c1a; --good:#6fdc8c; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}

/* Shell */
.app{display:grid; grid-template-rows:auto 1fr auto; min-height:100%}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line);
  padding-block:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:12px}
.brand{font-family:var(--display); font-weight:700; font-size:1.15rem; display:flex; align-items:center; gap:8px}
.tally{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.topbar .spacer{flex:1}
.balance{font-size:.8rem; padding:4px 10px; border:1px solid var(--line); border-radius:999px; white-space:nowrap}
.rail{display:none}
main{padding-block:16px 96px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); min-width:0}
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.tab{background:none; border:0; padding:8px 2px 10px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.7rem; color:var(--muted); cursor:pointer}
.tab svg{width:22px; height:22px}
.tab[aria-current="page"]{color:var(--accent)}
@media (min-width:960px){
  .app{grid-template-columns:220px 1fr; grid-template-rows:auto 1fr}
  .topbar{grid-column:1 / -1}
  .tabs{display:none}
  .rail{display:flex; flex-direction:column; gap:4px; padding:16px 12px; border-right:1px solid var(--line); background:var(--surface);
    position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); height:calc(100vh - 57px); padding-left:max(12px,env(safe-area-inset-left,0px))}
  .rail .tab{flex-direction:row; justify-content:flex-start; gap:10px; font-size:.9rem; padding:9px 12px; border-radius:var(--r-sm)}
  .rail .tab[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:24px 48px}
}

/* Shared pieces */
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.head p{color:var(--muted); max-width:60ch}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:9px 14px; cursor:pointer; font-weight:600; font-size:.9rem}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:.85rem; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--fg)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:.75rem; padding:3px 9px; border-radius:999px; font-weight:600}
.pill.good{background:var(--accent-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.neutral{background:var(--surface-2); color:var(--muted)}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field input[type=text], .field select, .field textarea{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:9px 11px; width:100%}
.field textarea{min-height:80px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr; gap:12px}
@media (min-width:600px){ .grid2{grid-template-columns:1fr 1fr} }
input[type=range]{width:100%; accent-color:var(--accent)}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px}
.switch{appearance:none; width:42px; height:24px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex:none; border:0}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--surface); transition:left .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{left:21px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; flex-wrap:wrap}
.seg button{border:0; background:var(--surface); padding:8px 12px; cursor:pointer; font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.note{font-size:.82rem; color:var(--muted)}
.callout{border-radius:var(--r-sm); padding:10px 12px; font-size:.85rem; display:flex; gap:8px; align-items:flex-start}
.callout.warn{background:var(--warn-soft); color:var(--fg)} .callout.info{background:var(--surface-2)}
.sample{font-size:.7rem; color:var(--muted); border:1px dashed var(--line); border-radius:999px; padding:2px 8px}
details summary{cursor:pointer; font-weight:600}
pre.prompt{white-space:pre-wrap; font-family:var(--mono); font-size:.75rem; background:var(--surface-2); border-radius:var(--r-sm); padding:12px; max-height:260px; overflow:auto; margin:8px 0 0}

/* Studio layout: controls + summary column on desktop */
.studio{display:grid; grid-template-columns:1fr; gap:16px}
@media (min-width:1100px){ .studio{grid-template-columns:minmax(0,1fr) 340px; align-items:start} .studio .side{position:sticky; top:84px} }
.studio>*,.card,.stack>*{min-width:0}
.brand{white-space:nowrap}
@media (max-width:520px){ .sample{display:none} }
.section-title{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px}

/* Model roster */
.roster{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
.model{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column}
.model .ph{aspect-ratio:3/4; background:var(--surface-2); max-width:100%; width:100%; object-fit:cover; display:block}
.model .ph.empty{display:grid; place-items:center; font-family:var(--display); font-size:2rem; color:var(--muted)}
.model .meta{padding:10px 12px; display:flex; flex-direction:column; gap:4px}
.model.add{border-style:dashed; align-items:center; justify-content:center; min-height:220px; gap:8px; color:var(--muted)}
.profile{display:grid; grid-template-columns:1fr; gap:16px}
@media (min-width:760px){ .profile{grid-template-columns:260px minmax(0,1fr)} }
.refs{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
.ref{border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface-2); display:flex; flex-direction:column}
.ref img{aspect-ratio:3/4; object-fit:cover; width:100%; display:block}
.ref .slot{aspect-ratio:3/4; display:grid; place-items:center; font-size:.75rem; color:var(--muted); text-align:center; padding:6px; border-bottom:1px dashed var(--line)}
.ref span{font-size:.72rem; padding:5px 7px; display:flex; justify-content:space-between; gap:4px}
.outfits{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px}
.outfit{flex:none; width:120px; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface); cursor:pointer; padding:0; text-align:left}
.outfit img{width:100%; aspect-ratio:3/4; object-fit:cover; display:block}
.outfit div{padding:6px 8px; font-size:.78rem}
.outfit[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}

/* Creation stepper */
.stepper{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px}
.stepper button{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:.82rem; cursor:pointer; display:flex; gap:6px; align-items:center}
.stepper button[aria-current="step"]{border-color:var(--accent); background:var(--accent-soft); font-weight:600}
.stepper .n{font-family:var(--mono); font-size:.72rem; color:var(--muted)}
.look-grid{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:700px){ .look-grid{grid-template-columns:1fr 1fr} }
.swatches{display:flex; gap:8px; flex-wrap:wrap}
.sw{width:30px; height:30px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line); cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

/* Video */
.clip{display:grid; grid-template-columns:72px minmax(0,1fr); gap:12px; align-items:start}
.clip .thumb{aspect-ratio:9/16; border-radius:var(--r-sm); background:linear-gradient(160deg,var(--surface-2),var(--line)); display:grid; place-items:center; font-size:.7rem; color:var(--muted)}
.checks{display:flex; flex-direction:column; gap:6px; font-size:.85rem}
.checks div{display:flex; justify-content:space-between; gap:4px 8px; flex-wrap:wrap}
.estimate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.estimate div{background:var(--surface-2); border-radius:var(--r-sm); padding:10px}
.estimate b{display:block; font-family:var(--mono); font-size:1.05rem}
.steps-scale{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); font-family:var(--mono)}

/* Jobs */
.jobs{display:flex; flex-direction:column; gap:10px}
.job{display:grid; grid-template-columns:48px minmax(0,1fr) auto; gap:12px; align-items:center}
.job img,.job .ph{width:48px; height:64px; object-fit:cover; border-radius:6px; background:var(--surface-2)}
.bar{height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--accent)}
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi .v{font-family:var(--mono); font-size:1.3rem; font-weight:500}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
.gallery figure{margin:0; border-radius:var(--r-sm); overflow:hidden; background:var(--surface-2); position:relative}
.gallery img{width:100%; aspect-ratio:9/16; object-fit:cover; display:block}
.gallery figcaption{position:absolute; left:6px; bottom:6px; font-size:.68rem; background:rgba(0,0,0,.6); color:#fff; padding:2px 6px; border-radius:4px}
.shots{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-top:12px}
.shots img{width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:var(--r-sm); display:block}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:var(--r-sm); font-size:.9rem; z-index:40; max-width:calc(100% - 32px)}
@media (min-width:960px){ .toast{bottom:24px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="tally" aria-hidden="true"></span>Muse Studio</div>
    <span class="sample">Prototype · sample data</span>
    <div class="spacer"></div>
    <span class="balance mono" title="RunPod balance">$6.07</span>
  </header>
  <nav class="rail" aria-label="Sections" id="rail"></nav>
  <main id="view"></main>
  <nav class="tabs" aria-label="Sections" id="tabs"></nav>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const IMG = /*IMGS*/{};
const ICONS = {
  models:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.6c2.9-.3 4.9 1.4 5.5 4.4"/></svg>',
  create:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  shoot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/><path d="M18 14.6V16l1 .8"/></svg>'
};
const SECTIONS = [['models','Models'],['create','Create'],['shoot','Photoshoot'],['video','Video'],['jobs','Jobs']];

/* ---------- Sample state (examples, not real records) ---------- */
const S = {
  models:[
    {id:'sienna', name:'Sienna Vale', age:24, niche:'Fashion & lifestyle', status:'Identity locked', cover:'green_front',
     refs:{'Face · front':'face_front','Face · profile':'face_side','Body · front':'green_front','Body · ¾':'green_tq','Body · side':'green_side','Body · back':'green_back'},
     outfits:[{n:'Green lounge set',img:'green_front'},{n:'Crystal mini dress',img:'crystal_front'}],
     never:['Tattoos','Rings','Necklaces']},
    {id:'noor', name:'Noor Ellis', age:27, niche:'Beauty & skincare', status:'Needs face close-ups', cover:null, refs:{}, outfits:[], never:['Tattoos']},
    {id:'kai', name:'Kai Moreno', age:29, niche:'Fitness', status:'Draft', cover:null, refs:{}, outfits:[], never:[]}
  ],
  sel:'sienna',
  jobs:[
    {id:1, kind:'Video', model:'sienna', title:'Living-room dance · 5.2s', engine:'H3', steps:10, step:6, state:'running', eta:'~4 min left', cost:0.65, img:'green_front'},
    {id:2, kind:'Photoshoot', model:'sienna', title:'Rooftop golden hour · 4 shots', engine:'Image', state:'done', cost:0.12, img:'crystal_front'},
    {id:3, kind:'Video', model:'sienna', title:'Bathroom trend · 5.9s', engine:'H3', steps:30, state:'done', cost:3.05, img:'crystal_face'},
    {id:4, kind:'Video', model:'sienna', title:'Kick test · 5.2s', engine:'Viggle (experimental)', state:'done', cost:0.13, img:'green_tq'}
  ],
  create:{step:0, name:'', age:24, niche:'', look:{}},
  video:{model:'sienna', outfit:0, engine:'h3', steps:10, length:5.2, bg:'keep', motion:'subtle', audio:'keep', lipsync:false, takes:1, consent:'yes-test'},
  shoot:{model:'sienna', outfit:0, scene:'Rooftop at golden hour', shot:'Medium', angle:'Eye level', lens:35, aperture:'f/2.8', light:'Golden hour', temp:4300, grade:'Phone-natural', realism:'Phone photo', count:4, ratio:'4:5', results:[]},
  gallery:'test'
};
const model = id => S.models.find(m=>m.id===id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- Navigation (hash routes) ---------- */
function nav(){
  const cur = (location.hash||'#models').slice(1).split('-')[0];
  const html = SECTIONS.map(([k,l])=>`<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':''}>${ICONS[k]}<span>${l}</span></button>`).join('');
  document.getElementById('tabs').innerHTML = html; document.getElementById('rail').innerHTML = html;
}
document.addEventListener('click', e=>{ const g=e.target.closest('[data-go]'); if(g){ location.hash=g.dataset.go; } });
window.addEventListener('hashchange', render);

function render(){
  nav();
  const r = (location.hash||'#models').slice(1);
  const v = document.getElementById('view');
  const [sec, arg] = r.split('-');
  if(sec==='models') v.innerHTML = arg ? viewProfile(arg) : viewModels();
  else if(sec==='create') v.innerHTML = viewCreate();
  else if(sec==='shoot') v.innerHTML = viewShoot();
  else if(sec==='video') v.innerHTML = viewVideo();
  else if(sec==='jobs') v.innerHTML = viewJobs();
  else v.innerHTML = viewModels();
  window.scrollTo(0,0);
}

/* ---------- Models ---------- */
function statusPill(s){ return s==='Identity locked'?`<span class="pill good">● ${s}</span>`: s==='Draft'?`<span class="pill neutral">${s}</span>`:`<span class="pill warn">${s}</span>`; }
function viewModels(){
  return `<div class="head"><div><h1>Your models</h1><p>Original AI personas. Each one keeps a locked identity, outfits and a never-add list that every shoot and video uses.</p></div>
  <button class="btn primary" data-go="create">New model</button></div>
  <div class="roster">
   ${S.models.map(m=>`<button class="model" data-go="models-${m.id}">
      ${m.cover?`<img class="ph" src="${IMG[m.cover]}" alt="${esc(m.name)}">`:`<div class="ph empty">${esc(m.name[0])}</div>`}
      <div class="meta"><h3>${esc(m.name)}</h3><span class="note">${esc(m.niche)} · ${m.age}</span>${statusPill(m.status)}</div></button>`).join('')}
   <button class="model add" data-go="create"><span style="font-size:1.6rem">+</span><span>Create a model</span></button>
  </div>`;
}
const REF_SLOTS = ['Face · front','Face · profile','Body · front','Body · ¾','Body · side','Body · back'];
function viewProfile(id){
  const m = model(id); if(!m) return viewModels();
  const missing = REF_SLOTS.filter(k=>!m.refs[k]);
  return `<button class="btn ghost" data-go="models" style="margin-bottom:12px">← Models</button>
  <div class="profile">
   <div class="stack">
     ${m.cover?`<img src="${IMG[m.cover]}" alt="" style="width:100%;border-radius:var(--r);aspect-ratio:3/4;object-fit:cover">`:`<div class="card" style="aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-size:3rem" class="muted">${esc(m.name[0])}</div>`}
     <div class="row"><button class="btn primary" data-go="video">Make a video</button><button class="btn" data-go="shoot">Photoshoot</button></div>
   </div>
   <div class="stack">
     <div><h1>${esc(m.name)}</h1><p class="muted">${esc(m.niche)} · age ${m.age} · ${statusPill(m.status)}</p></div>
     <section class="card"><div class="section-title"><h2>Identity references</h2><span class="note mono">${6-missing.length}/6</span></div>
       ${missing.length?`<div class="callout warn" style="margin-bottom:12px">Missing: ${missing.join(', ')}. Face close-ups matter most: without them the face comes out soft and drifts between videos.</div>`:''}
       <div class="refs">${REF_SLOTS.map(k=>`<div class="ref">${m.refs[k]?`<img src="${IMG[m.refs[k]]}" alt="${k}">`:`<div class="slot">Add ${k.toLowerCase()}</div>`}<span>${k}${m.refs[k]?'<b style="color:var(--good)">✓</b>':''}</span></div>`).join('')}</div>

     </section>

}

function runShoot(){ const s=S.shoot, m=model(s.model); const pool=[m.outfits[s.outfit].img,'crystal_face','face_front','green_tq']; s.results=Array.from({length:Math.min(s.count,4)},(_,i)=>pool[i%pool.length]); S.jobs.unshift({id:Date.now(),kind:'Photoshoot',model:m.id,title:`${s.scene} · ${s.count} shots`,engine:'Image',state:'done',cost:+(s.count*0.03).toFixed(2),img:pool[0]}); toast('Shoot done · sample images'); render(); }

/* ---------- Video ---------- */
const SEC_PER_STEP = 58 * (1/5.2); // H100 + FlashAttention 3, measured: 57.8s per step for a 5.2s clip
function vEstimate(){ const v=S.video;
  if(v.engine==='viggle') return {min:(95/60)*(v.length/5.2), cost:0.13*(v.length/5.2)*v.takes, gpu:'H200 NVL · $3.79/hr'};
  let min = v.steps * SEC_PER_STEP * v.length * Math.max(1, v.length/5.2*0.6+0.4) / 60; // longer clips cost more than linearly
  if(v.lipsync) min += 4; return {min, cost:(min/60)*3.99*v.takes, gpu:'H100 · $3.99/hr'}; }
function viewVideo(){
  const v=S.video, m=model(v.model), e=vEstimate();
  return `<div class="head"><div><h1>Video studio</h1><p>Put your model into a real clip. The performer's motion, timing and room stay; face, body and outfit become your model.</p></div></div>
  <div class="studio"><div class="stack">

      <label class="field"><span class="label">Use</span><select id="v-len" onchange="S.video.length=+this.value;render()">${[[5.2,'First 5.2s'],[9.4,'Full clip · 9.4s']].map(([x,l])=>`<option value="${x}" ${v.length===x?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Performer consent</span><select id="v-consent" onchange="S.video.consent=this.value;render()">
        <option value="yes-test" ${v.consent==='yes-test'?'selected':''}>On file · private tests only</option>
        <option value="yes-post" ${v.consent==='yes-post'?'selected':''}>On file · posting allowed</option>
        <option value="none" ${v.consent==='none'?'selected':''}>No record</option></select></label>
      ${v.consent==='none'?`<div class="callout warn">Add the performer's written okay before generating. Clips without consent can't be made.</div>`:v.consent==='yes-test'?`<p class="note">Results from this clip go to the test gallery and can't be exported for posting.</p>`:''}
    </section>
    <section class="card"><h2 style="margin-bottom:10px">Model and outfit</h2>${modelPicker(v,'video')}<div style="margin-top:12px">${outfitPicker(v,'video')}</div>
      <p class="note" style="margin-top:8px">Never add: ${m.never.join(', ')||'nothing'} · removed automatically.</p></section>
    <section class="card stack"><h2>Engine and quality</h2>
      <div class="seg"><button aria-pressed="${v.engine==='h3'}" onclick="S.video.engine='h3';render()">H3 · reference set</button><button aria-pressed="${v.engine==='viggle'}" onclick="S.video.engine='viggle';render()">Viggle · experimental</button></div>
      ${v.engine==='viggle'?`<div class="callout warn">Experimental. Motion timing is exact on fast moves, but the face is softer and can warp slightly. Identity comes from one repainted frame.</div>`:
      `<div class="field"><span class="label">Steps · <span class="mono" id="v-steps-v">${v.steps}</span>${v.steps===10?' <span class="pill good">Recommended</span>':v.steps>10?' <span class="pill neutral">Rarely worth it</span>':' <span class="pill warn">Below tested range</span>'}</span>
        <input type="range" id="v-steps" min="4" max="30" value="${v.steps}" oninput="S.video.steps=+this.value;render()" aria-describedby="v-steps-help">
        <div class="steps-scale"><span>4</span><span>10</span><span>20</span><span>30</span></div>

    </section>
    <section class="card stack"><h2>Background</h2>
      <div class="seg"><button aria-pressed="${v.bg==='keep'}" onclick="S.video.bg='keep';render()">Keep the real room</button><button aria-pressed="${v.bg==='photo'}" onclick="S.video.bg='photo';render()">New background photo</button></div>
      ${v.bg==='photo'?`<div class="field"><span class="label">Motion in the background</span><div class="row">${['still','subtle','busy'].map(o=>`<button class="chip" aria-pressed="${v.motion===o}" onclick="S.video.motion='${o}';render()">${o==='still'?'Still':o==='subtle'?'Subtly alive (recommended)':'Busy'}</button>`).join('')}</div></div>

    <section class="card stack"><h2>Sound and lips</h2>

      <label class="toggle"><span><b>Lip sync</b><br><span class="note">Only for talking or singing clips. Adds ~4 min.</span></span><input type="checkbox" class="switch" id="v-lip" ${v.lipsync?'checked':''} onchange="S.video.lipsync=this.checked;render()"></label>
    </section>
  </div>

      <p class="note mono">${e.gpu}${v.engine==='h3'?' · FlashAttention 3':''}</p>
      <button class="btn primary" ${v.consent==='none'?'disabled':''} onclick="runVideo()">Generate ${v.takes>1?v.takes+' takes':''}</button>
      <details><summary class="note">Show the prompt</summary><pre class="prompt">${esc(videoPrompt())}</pre></details></section>
    <section class="card"><p class="note">Every export gets the AI-generated label. Brand content also needs #ad and TikTok's Branded content toggle.</p></section>
  </aside></div>`;
}
function videoPrompt(){ const v=S.video, m=model(v.model), o=m.outfits[v.outfit];
  return `subject_definitions:
<Subject 1> is the performer in <Video 1>.
<Subject 2> is ${m.name}, shown in <Image 1>-<Image 6>.
summary:
[video editing + character replacement${v.audio==='keep'?' + audio reuse':''}] Replace <Subject 1> with <Subject 2>. Keep every movement, pose and expression at the same moment. ${v.bg==='keep'?'The room, camera and light of <Video 1> are unchanged.':'Move the scene into the location in <Image 7> ('+v.motion+' background).'}
retention_analysis:
<Subject 2>: outfit = ${o?o.n:'—'}. None of these appear: ${m.never.join(', ')||'—'}.
${v.audio==='keep'?'<Audio 1>: fully_copy.':''}
settings: steps=${v.engine==='h3'?v.steps:4}, engine=${v.engine==='h3'?'H3 Ref2VA':'Viggle-Animate'}, 768x1344, ${v.length}s`; }
function runVideo(){ const v=S.video, m=model(v.model), e=vEstimate(); for(let t=0;t<v.takes;t++) S.jobs.unshift({id:Date.now()+t,kind:'Video',model:m.id,title:`New swap · ${v.length}s${v.takes>1?' · take '+(t+1):''}`,engine:v.engine==='h3'?'H3':'Viggle (experimental)',steps:v.steps,step:0,state:'queued',eta:'starting GPU',cost:+(e.cost/v.takes).toFixed(2),img:m.outfits[v.outfit].img}); toast('Queued · GPU starting'); location.hash='jobs'; }

/* ---------- Jobs ---------- */

  const spent = S.jobs.reduce((a,j)=>a+(j.cost||0),0);
  return `<div class="head"><div><h1>Jobs and results</h1><p>Every render, what it cost, and where it landed. The GPU shuts down when the queue is empty.</p></div></div>

    <div class="card kpi"><span class="label">GPU</span><div class="v" style="font-size:1rem">${S.jobs.some(j=>j.state!=='done')?'<span class="pill good">● H100 running</span>':'<span class="pill neutral">Off</span>'}</div></div>

        ${j.state==='running'?`<div class="bar"><i style="width:${(j.step/j.steps)*100}%"></i></div><div class="note mono">step ${j.step}/${j.steps} · ${j.eta}</div>`:j.state==='queued'?`<div class="note mono">${j.eta}</div>`:''}</div>
      <div style="text-align:right">${j.state==='done'?'<span class="pill good">Done</span>':j.state==='running'?'<span class="pill warn">Running</span>':'<span class="pill neutral">Queued</span>'}<div class="note mono">$${(j.cost||0).toFixed(2)}</div></div></div>`).join('')}
  </div></section>
  <aside class="side stack"><section class="card stack"><div class="section-title"><h2>Gallery</h2>
      <div class="seg"><button aria-pressed="${S.gallery==='test'}" onclick="S.gallery='test';render()">Tests</button><button aria-pressed="${S.gallery==='final'}" onclick="S.gallery='final';render()">Final</button></div></div>
      ${S.gallery==='test'?`<div class="gallery">${['green_front','green_tq','crystal_face','crystal_front'].map((k,i)=>`<figure><img src="${IMG[k]}" alt=""><figcaption>${['10 steps','Viggle','30 steps','Shoot'][i]}</figcaption></figure>`).join('')}</div>
        <p class="note">Tests stay here and never fill your final gallery.</p>`:`<p class="note">Nothing approved yet. Approve a take to move it here and export for TikTok (1080×1920, AI label on).</p>`}
    </section></aside></div>`;
}
render();
</script>
