# MUSE GPU worker: pinned Python packages for the H3 venv on the RunPod network volume.
#
# Matches what produced plans/video-test-results.md (Nov 3-4, 2026): torch 2.10 cu130 on H100
# (CUDA-13 driver), torchcodec 0.10 (0.17 silently returns no audio), DiffSynth-Studio deps incl.
# bitsandbytes (NF4 text encoder), comfy-kitchen, and `kernels` for kernels-community/flash-attn3.
# Resolved for Linux x86_64 / Python 3.11 with `uv pip compile` (cut-off 2026-11-04), from:
#   torch==2.10.0+cu130 torchvision==0.25.0+cu130 torchaudio==2.10.0+cu130 transformers imageio[ffmpeg]
#   safetensors einops modelscope ftfy pandas accelerate peft av librosa bitsandbytes comfy-kitchen
#   kernels huggingface_hub[hf_xet]
# The test pods installed these unpinned on the same days, so exact patch versions may differ slightly.
#
# Install (bootstrap.sh does this):
#   pip install -r requirements.lock --extra-index-url https://download.pytorch.org/whl/cu130
#   pip install --no-deps --index-url https://pypi.org/simple torchcodec==0.10.0   (see marker below)
#   pip install --no-deps -e DiffSynth-Studio   (at the commit below)
